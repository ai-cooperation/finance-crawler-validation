name: Finance topic radar vertical slice

on:
  workflow_dispatch:
    inputs:
      verify_resilience:
        description: Replay the published payload and inject one invalid publish
        required: false
        type: boolean
        default: false
      verify_alert_delivery:
        description: Fail before checkout/admission to verify the external alert path
        required: false
        type: boolean
        default: false
      verify_freshness_watchdog:
        description: Run the D1 freshness watchdog without admission or crawling
        required: false
        type: boolean
        default: false
      verify_soak_boundary:
        description: Prove a manual OIDC identity cannot write schedule-only soak evidence
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: finance-topic-radar
  cancel-in-progress: false

jobs:
  collect-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reject mutually exclusive control-plane validation modes
        if: >-
          (inputs.verify_alert_delivery && inputs.verify_freshness_watchdog) ||
          (inputs.verify_alert_delivery && inputs.verify_soak_boundary) ||
          (inputs.verify_freshness_watchdog && inputs.verify_soak_boundary)
        run: |
          echo "::error title=Invalid alert validation::Select only one alert validation mode."
          exit 2

      - name: Inject alert delivery validation failure
        if: >-
          inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        run: |
          echo "::error title=Expected alert validation failure::This failure verifies the external notification path."
          exit 1

      - name: Run authenticated freshness watchdog
        if: >-
          inputs.verify_freshness_watchdog &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_soak_boundary
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          jq -n \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            '{
              schema_version: 1,
              workflow_run_id: $workflow_run_id,
              commit_sha: $commit_sha
            }' >"$RUNNER_TEMP/freshness-check.json"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/freshness-check.json" \
            "$INGEST_WORKER_URL/v1/alerts/freshness-check")"
          jq -e '
            (.delivered | type == "boolean") and
            (.transition | IN("opened", "deduplicated", "resolved", "healthy"))
          ' <<<"$response"

      - name: Verify manual identity cannot write soak evidence
        if: >-
          inputs.verify_soak_boundary &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          jq -n \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            '{
              schema_version: 1,
              workflow_run_id: $workflow_run_id,
              run_attempt: $run_attempt,
              commit_sha: $commit_sha
            }' >"$RUNNER_TEMP/soak-boundary-request.json"
          response_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/soak-boundary-result.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/soak-boundary-request.json" \
            "$INGEST_WORKER_URL/v1/soak/observe")"
          test "$response_status" = "403"
          jq -e '.error == "schedule_identity_required"' \
            "$RUNNER_TEMP/soak-boundary-result.json" >/dev/null

      - name: Check out repository
        if: >-
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: >-
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install admission client only
        if: >-
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip install --disable-pip-version-check \
            'PyYAML>=6.0,<7' \
            'jsonschema[format]>=4.23,<5'

      - name: Request OIDC admission and persisted checkpoints
        if: >-
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        id: admission
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          mkdir -p artifacts/topic-radar
          finance-topic-radar-plan \
            --manifest radar-sources.yaml \
            --output "$RUNNER_TEMP/run-plan-request.json"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/run-plan-request.json" \
            "$INGEST_WORKER_URL/v1/run/plan" \
            >artifacts/topic-radar/run-plan.json
          jq -er '.admitted | type == "boolean"' artifacts/topic-radar/run-plan.json >/dev/null
          admitted="$(jq -r '.admitted' artifacts/topic-radar/run-plan.json)"
          echo "admitted=$admitted" >>"$GITHUB_OUTPUT"
          if [[ "$admitted" != "true" ]]; then
            reason="$(jq -er '.reason' artifacts/topic-radar/run-plan.json)"
            retry="$(jq -er '.retry_after_seconds' artifacts/topic-radar/run-plan.json)"
            echo "::notice title=Topic radar quota guard::Skipped before Browser setup: $reason; retry after ${retry}s"
          fi

      - name: Install full collector
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install Chromium and system dependencies
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        run: python -m playwright install --with-deps chromium

      - name: Collect 15-source radar slice
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        run: >-
          finance-topic-radar
          --manifest radar-sources.yaml
          --run-plan artifacts/topic-radar/run-plan.json
          --output artifacts/topic-radar

      - name: Ingest and publish through GitHub OIDC
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @artifacts/topic-radar/ingest-envelope.json \
            "$INGEST_WORKER_URL/v1/ingest/items"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @artifacts/topic-radar/topic-snapshot.json \
            "$INGEST_WORKER_URL/v1/ingest/publish"

      - name: Verify replay and last-good resilience
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          !inputs.verify_alert_delivery &&
          !inputs.verify_freshness_watchdog &&
          !inputs.verify_soak_boundary &&
          inputs.verify_resilience
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          status_before="$(curl --fail-with-body --silent --show-error \
            "$INGEST_WORKER_URL/v1/status")"
          items_replay="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @artifacts/topic-radar/ingest-envelope.json \
            "$INGEST_WORKER_URL/v1/ingest/items")"
          jq -e '.replayed == true' <<<"$items_replay"
          publish_replay="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @artifacts/topic-radar/topic-snapshot.json \
            "$INGEST_WORKER_URL/v1/ingest/publish")"
          jq -e '.replayed == true' <<<"$publish_replay"
          jq '.unexpected_failure_injection = true' \
            artifacts/topic-radar/topic-snapshot.json \
            >"$RUNNER_TEMP/invalid-topic-snapshot.json"
          failure_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/invalid-publish-response.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/invalid-topic-snapshot.json" \
            "$INGEST_WORKER_URL/v1/ingest/publish")"
          test "$failure_status" = "422"
          jq -e '.error == "invalid_payload"' \
            "$RUNNER_TEMP/invalid-publish-response.json"
          status_after="$(curl --fail-with-body --silent --show-error \
            "$INGEST_WORKER_URL/v1/status")"
          test "$(jq -r '.current_snapshot.snapshot_id' <<<"$status_after")" = \
            "$(jq -r '.current_snapshot.snapshot_id' <<<"$status_before")"
          test "$(jq -r '.current_snapshot.content_sha256' <<<"$status_after")" = \
            "$(jq -r '.current_snapshot.content_sha256' <<<"$status_before")"

      # This endpoint accepts only a real GitHub `schedule` OIDC identity. It is
      # deliberately after all workload steps and uses `always()` so admitted,
      # denied, and failed scheduled runs all produce bounded control-plane
      # evidence without starting another crawl or listing the R2 bucket.
      - name: Record schedule-only soak observation
        if: always() && github.event_name == 'schedule'
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          jq -n \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            '{
              schema_version: 1,
              workflow_run_id: $workflow_run_id,
              run_attempt: $run_attempt,
              commit_sha: $commit_sha
            }' >"$RUNNER_TEMP/soak-observation-request.json"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/soak-observation-request.json" \
            "$INGEST_WORKER_URL/v1/soak/observe")"
          jq -e '
            .schema_version == 1 and
            .workflow_run_id == env.GITHUB_RUN_ID and
            .run_attempt == (env.GITHUB_RUN_ATTEMPT | tonumber) and
            .commit_sha == env.GITHUB_SHA and
            (.admission.decision | IN("admitted", "denied")) and
            (.r2_integrity.checked_objects >= 1) and
            (.r2_integrity.checked_objects <= 4) and
            .r2_integrity.all_metadata_match == true
          ' <<<"$response" >/dev/null

      - name: Upload public source-health report
        if: always() && hashFiles('artifacts/topic-radar/run-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-topic-radar-${{ github.run_id }}
          path: artifacts/topic-radar/run-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Deliver external failure alert through OIDC
        if: failure()
        env:
          INGEST_WORKER_URL: ${{ vars.INGEST_WORKER_URL }}
          OIDC_AUDIENCE: finance-crawler-validation-ingest
        run: |
          set -euo pipefail
          test -n "$INGEST_WORKER_URL"
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          jq -n \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schema_version: 1,
              workflow_run_id: $workflow_run_id,
              commit_sha: $commit_sha,
              conclusion: "failure",
              run_url: $run_url
            }' >"$RUNNER_TEMP/action-failure.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/action-failure.json" \
            "$INGEST_WORKER_URL/v1/alerts/action-failure"

      - name: Open a failure alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failure_issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "Topic radar failed: run $GITHUB_RUN_ID in:title" \
            --json number,title \
            --jq 'map(select(.title == "Topic radar failed: run '"$GITHUB_RUN_ID"'"))[0].number // empty')"
          if [[ -z "$failure_issue_number" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Topic radar failed: run $GITHUB_RUN_ID" \
              --body "The topic-radar workflow failed. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "::notice title=Failure issue deduplicated::Issue #$failure_issue_number already tracks this run."
          fi
