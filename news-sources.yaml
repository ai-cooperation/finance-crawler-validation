version: 1
status: complete
target:
  total_brands: 120
  finance_specialist: 100
  general_finance_desk: 20

# Endpoints are ordered fallbacks inside one brand. Adding another endpoint
# never increases the unique-brand denominator.
finance_specialist_defaults: &finance_specialist_defaults
  brand_class: finance_specialist
  languages: [en]
general_finance_desk_defaults: &general_finance_desk_defaults
  brand_class: general_finance_desk
  languages: [en]

brands:
  - <<: *finance_specialist_defaults
    id: bloomberg
    name: Bloomberg
    canonical_domain: bloomberg.com
    region: US
    endpoints:
      - {id: bloomberg_rss, transport: rss, url: https://feeds.bloomberg.com/markets/news.rss, required_capabilities: [http, rss]}
      - {id: bloomberg_browser, transport: browser, url: https://www.bloomberg.com/markets, required_capabilities: [http, javascript, chromium]}
  - <<: *finance_specialist_defaults
    id: reuters
    name: Reuters
    canonical_domain: reuters.com
    region: global
    endpoints:
      # First-party Reuters finance podcast publishing interface. This does not
      # override or bypass the separate reuters.com Browser robots denial.
      - {id: reuters_morning_bid_podcast_rss, transport: rss, url: https://feeds.megaphone.fm/THRH7907651499, required_capabilities: [http, rss]}
      - {id: reuters_browser, transport: browser, url: https://www.reuters.com/markets/, required_capabilities: [http, javascript, chromium]}
