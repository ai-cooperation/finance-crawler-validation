[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finance-crawler-poc"
version = "0.1.0"
description = "A reproducible capability probe for finance crawling paths on GitHub Actions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
  "crawl4ai==0.9.2",
  "httpx[http2]>=0.27.2,<1",
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
finance-crawler-probe = "finance_crawler_poc.cli:main"
finance-news-probe = "finance_crawler_poc.news_cli:main"
finance-news-normalize = "finance_crawler_poc.news_normalize:main"
finance-h3-assemble = "finance_crawler_poc.h3_assemble:main"
finance-topic-radar = "finance_crawler_poc.radar_cli:main"
finance-topic-radar-plan = "finance_crawler_poc.radar_run_plan:main"
finance-openbb-align = "finance_crawler_poc.openbb_alignment_cli:main"
finance-research-depth = "finance_crawler_poc.financial_depth_cli:main"
finance-tradingagents-plan = "finance_crawler_poc.tradingagents_plan_cli:main"
finance-soak-verify = "finance_crawler_poc.soak_verify:main"
finance-soak-usage-collect = "finance_crawler_poc.soak_usage_collect:main"
finance-app-a-gate = "finance_crawler_poc.app_a_gate:main"
finance-app-a-remote = "finance_crawler_poc.app_a_remote:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_crawler_poc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["finance_crawler_poc"]

[tool.coverage.report]
fail_under = 80
show_missing = true
