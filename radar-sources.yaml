version: 1
minimum_successful_sources: 12
maximum_items_per_run: 60

# Phase-0 vertical slice: 15 unique origins, not repeated routes for one brand.
# Every record defaults to private, metadata-only retention in R2.
sources:
  - schema_version: 1
    source_id: federal_reserve_press_rss
    name: Federal Reserve Press Releases
    kind: official_news
    layer: official
    transport: rss
    canonical_url: https://www.federalreserve.gov/feeds/press_all.xml
    freshness_sla_minutes: 360
    rights: {redistribution: metadata_only, retention_days: 30, public_excerpt_chars: 0}
    extractor: rss
    max_items: 3
    timeout_seconds: 30

  - schema_version: 1
    source_id: ecb_press_rss
    name: European Central Bank Press Releases
    kind: official_news
    layer: official
    transport: rss
    canonical_url: https://www.ecb.europa.eu/rss/press.html
    freshness_sla_minutes: 360
    rights: {redistribution: metadata_only, retention_days: 30, public_excerpt_chars: 0}
    extractor: rss
    max_items: 3
    timeout_seconds: 30

